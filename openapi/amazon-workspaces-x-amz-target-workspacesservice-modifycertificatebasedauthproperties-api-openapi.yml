security:
- hmac: []
tags:
- name: '#X Amz Target=WorkspacesService.ModifyCertificateBasedAuthProperties'
paths:
  /#X-Amz-Target=WorkspacesService.ModifyCertificateBasedAuthProperties:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ModifyCertificateBasedAuthProperties
      description: Modifies the properties of the certificate-based authentication you want to use with your WorkSpaces.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyCertificateBasedAuthPropertiesResult'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InvalidParameterValuesException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValuesException'
        '482':
          description: OperationNotSupportedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotSupportedException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyCertificateBasedAuthPropertiesRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.ModifyCertificateBasedAuthProperties
      summary: Amazon WorkSpaces Modify Certificate Based Auth Properties
      tags:
      - '#X Amz Target=WorkspacesService.ModifyCertificateBasedAuthProperties'
components:
  schemas:
    CertificateAuthorityArn:
      type: string
      pattern: arn:[\w+=/,.@-]+:[\w+=/,.@-]+:[\w+=/,.@-]*:[0-9]*:[\w+=,.@-]+(/[\w+=,.@-]+)*
      minLength: 5
      maxLength: 200
    ModifyCertificateBasedAuthPropertiesRequest:
      type: object
      required:
      - ResourceId
      title: ModifyCertificateBasedAuthPropertiesRequest
      properties:
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/DirectoryId'
          - description: The resource identifiers, in the form of directory IDs.
        CertificateBasedAuthProperties:
          allOf:
          - $ref: '#/components/schemas/CertificateBasedAuthProperties'
          - description: The properties of the certificate-based authentication.
        PropertiesToDelete:
          allOf:
          - $ref: '#/components/schemas/DeletableCertificateBasedAuthPropertiesList'
          - description: The properties of the certificate-based authentication you want to delete.
    AccessDeniedException: {}
    InvalidParameterValuesException: {}
    DeletableCertificateBasedAuthPropertiesList:
      type: array
      items:
        $ref: '#/components/schemas/DeletableCertificateBasedAuthProperty'
    DeletableCertificateBasedAuthProperty:
      type: string
      enum:
      - CERTIFICATE_BASED_AUTH_PROPERTIES_CERTIFICATE_AUTHORITY_ARN
    CertificateBasedAuthStatusEnum:
      type: string
      enum:
      - DISABLED
      - ENABLED
    ModifyCertificateBasedAuthPropertiesResult:
      type: object
      properties: {}
    CertificateBasedAuthProperties:
      type: object
      properties:
        Status:
          allOf:
          - $ref: '#/components/schemas/CertificateBasedAuthStatusEnum'
          - description: The status of the certificate-based authentication properties.
        CertificateAuthorityArn:
          allOf:
          - $ref: '#/components/schemas/CertificateAuthorityArn'
          - description: The Amazon Resource Name (ARN) of the Amazon Web Services Certificate Manager Private CA resource.
      description: Describes the properties of the certificate-based authentication you want to use with your WorkSpaces.
    OperationNotSupportedException: {}
    ResourceNotFoundException: {}
    DirectoryId:
      type: string
      pattern: ^d-[0-9a-f]{8,63}$
      minLength: 10
      maxLength: 65
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
