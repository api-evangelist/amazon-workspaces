tags:
- name: '#X Amz Target=WorkspacesService.AssociateConnectionAlias'
paths:
  /#X-Amz-Target=WorkspacesService.AssociateConnectionAlias:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: AssociateConnectionAlias
      description: 'Associates the specified connection alias with the specified directory to enable cross-Region redirection. For more information, see Cross-Region Redirection for Amazon WorkSpaces.


        Before performing this operation, call DescribeConnectionAliases to make sure that the current state of the connection alias is CREATED.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssociateConnectionAliasResult'
        '480':
          description: ResourceAssociatedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAssociatedException'
        '481':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: InvalidParameterValuesException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValuesException'
        '484':
          description: InvalidResourceStateException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidResourceStateException'
        '485':
          description: OperationNotSupportedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotSupportedException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssociateConnectionAliasRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.AssociateConnectionAlias
      summary: Amazon WorkSpaces Associate Connection Alias
      tags:
      - '#X Amz Target=WorkspacesService.AssociateConnectionAlias'
components:
  schemas:
    AccessDeniedException: {}
    AssociateConnectionAliasRequest:
      type: object
      required:
      - AliasId
      - ResourceId
      title: AssociateConnectionAliasRequest
      properties:
        AliasId:
          allOf:
          - $ref: '#/components/schemas/ConnectionAliasId'
          - description: The identifier of the connection alias.
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The identifier of the directory to associate the connection alias with.
    ConnectionAliasId:
      type: string
      pattern: ^wsca-[0-9a-z]{8,63}$
      minLength: 13
      maxLength: 68
    AssociateConnectionAliasResult:
      type: object
      properties:
        ConnectionIdentifier:
          allOf:
          - $ref: '#/components/schemas/ConnectionIdentifier'
          - description: 'The identifier of the connection alias association. You use the connection identifier in the DNS TXT record when you''re configuring your DNS routing policies. '
    ConnectionIdentifier:
      type: string
      pattern: ^[a-zA-Z0-9]+$
      minLength: 1
      maxLength: 20
    InvalidResourceStateException: {}
    ResourceNotFoundException: {}
    ResourceAssociatedException: {}
    NonEmptyString:
      type: string
      minLength: 1
    OperationNotSupportedException: {}
    InvalidParameterValuesException: {}
