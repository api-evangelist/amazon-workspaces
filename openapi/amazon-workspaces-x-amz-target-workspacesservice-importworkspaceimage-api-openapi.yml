security:
- hmac: []
tags:
- name: '#X Amz Target=WorkspacesService.ImportWorkspaceImage'
paths:
  /#X-Amz-Target=WorkspacesService.ImportWorkspaceImage:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ImportWorkspaceImage
      description: Imports the specified Windows 10 or 11 Bring Your Own License (BYOL) image into Amazon WorkSpaces. The image must be an already licensed Amazon EC2 image that is in your Amazon Web Services account, and you must own the image. For more information about creating BYOL images, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/byol-windows-images.html"> Bring Your Own Windows Desktop Licenses</a>.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportWorkspaceImageResult'
        '480':
          description: ResourceLimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLimitExceededException'
        '481':
          description: ResourceAlreadyExistsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAlreadyExistsException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: OperationNotSupportedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotSupportedException'
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '485':
          description: InvalidParameterValuesException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValuesException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportWorkspaceImageRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.ImportWorkspaceImage
      summary: Amazon WorkSpaces Import Workspace Image
      tags:
      - '#X Amz Target=WorkspacesService.ImportWorkspaceImage'
components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    ResourceAlreadyExistsException: {}
    ResourceLimitExceededException: {}
    TagValue:
      type: string
      maxLength: 255
    Tag:
      type: object
      required:
      - Key
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key of the tag.
        Value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value of the tag.
      description: Describes a tag.
    ApplicationList:
      type: array
      items:
        $ref: '#/components/schemas/Application'
      minItems: 1
      maxItems: 5
    ImportWorkspaceImageRequest:
      type: object
      required:
      - Ec2ImageId
      - IngestionProcess
      - ImageName
      - ImageDescription
      title: ImportWorkspaceImageRequest
      properties:
        Ec2ImageId:
          allOf:
          - $ref: '#/components/schemas/Ec2ImageId'
          - description: The identifier of the EC2 image.
        IngestionProcess:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageIngestionProcess'
          - description: <p>The ingestion process to be used when importing the image, depending on which protocol you want to use for your BYOL Workspace image, either PCoIP, WorkSpaces Streaming Protocol (WSP), or bring your own protocol (BYOP). To use WSP, specify a value that ends in <code>_WSP</code>. To use PCoIP, specify a value that does not end in <code>_WSP</code>. To use BYOP, specify a value that ends in <code>_BYOP</code>.</p> <p>For non-GPU-enabled bundles (bundles other than Graphics or GraphicsPro), specify <code>BYOL_REGULAR</code>, <code>BYOL_REGULAR_WSP</code>, or <code>BYOL_REGULAR_BYOP</code>, depending on the protocol.</p> <note> <p>The <code>BYOL_REGULAR_BYOP</code> and <code>BYOL_GRAPHICS_G4DN_BYOP</code> values are only supported by Amazon WorkSpaces Core. Contact your account team to be allow-listed to use these values. For more information, see <a href="http://aws.amazon.com/workspaces/core/">Amazon WorkSpaces Core</a>.</p> </note>
        ImageName:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageName'
          - description: The name of the WorkSpace image.
        ImageDescription:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageDescription'
          - description: The description of the WorkSpace image.
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags. Each WorkSpaces resource can have a maximum of 50 tags.
        Applications:
          allOf:
          - $ref: '#/components/schemas/ApplicationList'
          - description: <p>If specified, the version of Microsoft Office to subscribe to. Valid only for Windows 10 and 11 BYOL images. For more information about subscribing to Office for BYOL images, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/byol-windows-images.html"> Bring Your Own Windows Desktop Licenses</a>.</p> <note> <ul> <li> <p>Although this parameter is an array, only one item is allowed at this time.</p> </li> <li> <p>Windows 11 only supports <code>Microsoft_Office_2019</code>.</p> </li> </ul> </note>
    WorkspaceImageId:
      type: string
      pattern: wsi-[0-9a-z]{9,63}$
    InvalidParameterValuesException: {}
    WorkspaceImageName:
      type: string
      pattern: ^[a-zA-Z0-9_./()\\-]+$
      minLength: 1
      maxLength: 64
    ResourceNotFoundException: {}
    WorkspaceImageIngestionProcess:
      type: string
      enum:
      - BYOL_REGULAR
      - BYOL_GRAPHICS
      - BYOL_GRAPHICSPRO
      - BYOL_GRAPHICS_G4DN
      - BYOL_REGULAR_WSP
      - BYOL_REGULAR_BYOP
      - BYOL_GRAPHICS_G4DN_BYOP
    AccessDeniedException: {}
    Application:
      type: string
      enum:
      - Microsoft_Office_2016
      - Microsoft_Office_2019
    OperationNotSupportedException: {}
    ImportWorkspaceImageResult:
      type: object
      properties:
        ImageId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageId'
          - description: The identifier of the WorkSpace image.
    Ec2ImageId:
      type: string
      pattern: ^ami\-([a-f0-9]{8}|[a-f0-9]{17})$
    TagKey:
      type: string
      minLength: 1
      maxLength: 127
    WorkspaceImageDescription:
      type: string
      pattern: ^[a-zA-Z0-9_./() -]+$
      minLength: 1
      maxLength: 256
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
