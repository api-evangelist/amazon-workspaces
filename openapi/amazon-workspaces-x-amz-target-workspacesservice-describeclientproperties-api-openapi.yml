      type: array
      items:
        $ref: '#/components/schemas/NonEmptyString'
      minItems: 1
      maxItems: 25
    DescribeClientPropertiesResult:
      type: object
      properties:
        ClientPropertiesList:
          allOf:
          - $ref: '#/components/schemas/ClientPropertiesList'
