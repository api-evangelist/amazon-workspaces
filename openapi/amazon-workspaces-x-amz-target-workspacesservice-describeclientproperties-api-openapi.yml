          - description: The resource identifier, in the form of a directory ID.
        ClientProperties:
          allOf:
          - $ref: '#/components/schemas/ClientProperties'
          - description: Information about the Amazon WorkSpaces client.
      description: Information about the Amazon WorkSpaces client.
    DescribeClientPropertiesRequest:
