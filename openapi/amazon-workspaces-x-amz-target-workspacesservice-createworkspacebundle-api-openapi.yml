components:
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    ResourceAlreadyExistsException: {}
    BundleId:
      type: string
      pattern: ^wsb-[0-9a-z]{8,63}$
    ResourceLimitExceededException: {}
    BundleOwner:
      type: string
    ComputeType:
      type: object
      properties:
        Name:
          allOf:
          - $ref: '#/components/schemas/Compute'
          - description: The compute type.
      description: Describes the compute type of the bundle.
    TagValue:
      type: string
      maxLength: 255
    NonEmptyString:
      type: string
      minLength: 1
    WorkspaceBundleName:
      type: string
      pattern: ^[a-zA-Z0-9_./()\\-]+$
      minLength: 1
      maxLength: 64
    Tag:
      type: object
      required:
      - Key
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key of the tag.
        Value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value of the tag.
      description: Describes a tag.
    WorkspaceBundle:
      type: object
      properties:
        BundleId:
          allOf:
          - $ref: '#/components/schemas/BundleId'
          - description: The identifier of the bundle.
        Name:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The name of the bundle.
        Owner:
          allOf:
          - $ref: '#/components/schemas/BundleOwner'
          - description: The owner of the bundle. This is the account identifier of the owner, or <code>AMAZON</code> if the bundle is provided by Amazon Web Services.
        Description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The description of the bundle.
        ImageId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageId'
          - description: The identifier of the image that was used to create the bundle.
        RootStorage:
          allOf:
          - $ref: '#/components/schemas/RootStorage'
          - description: The size of the root volume.
        UserStorage:
          allOf:
          - $ref: '#/components/schemas/UserStorage'
          - description: The size of the user volume.
        ComputeType:
          allOf:
          - $ref: '#/components/schemas/ComputeType'
          - description: The compute type of the bundle. For more information, see <a href="http://aws.amazon.com/workspaces/details/#Amazon_WorkSpaces_Bundles">Amazon WorkSpaces Bundles</a>.
        LastUpdatedTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The last time that the bundle was updated.
        CreationTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time when the bundle was created.
        State:
          allOf:
          - $ref: '#/components/schemas/WorkspaceBundleState'
          - description: The state of the WorkSpace bundle.
        BundleType:
          allOf:
          - $ref: '#/components/schemas/BundleType'
          - description: The type of WorkSpace bundle.
      description: Describes a WorkSpace bundle.
    WorkspaceBundleState:
      type: string
      enum:
      - AVAILABLE
      - PENDING
      - ERROR
    WorkspaceImageId:
      type: string
      pattern: wsi-[0-9a-z]{9,63}$
    InvalidParameterValuesException: {}
    RootStorage:
      type: object
      properties:
        Capacity:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The size of the root volume.
      description: Describes the root volume for a WorkSpace bundle.
    Compute:
      type: string
      enum:
      - VALUE
      - STANDARD
      - PERFORMANCE
      - POWER
      - GRAPHICS
      - POWERPRO
      - GRAPHICSPRO
      - GRAPHICS_G4DN
      - GRAPHICSPRO_G4DN
    CreateWorkspaceBundleRequest:
      type: object
      required:
      - BundleName
      - BundleDescription
      - ImageId
      - ComputeType
      - UserStorage
      title: CreateWorkspaceBundleRequest
      properties:
        BundleName:
          allOf:
          - $ref: '#/components/schemas/WorkspaceBundleName'
          - description: The name of the bundle.
        BundleDescription:
          allOf:
          - $ref: '#/components/schemas/WorkspaceBundleDescription'
          - description: The description of the bundle.
        ImageId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageId'
          - description: The identifier of the image that is used to create the bundle.
        ComputeType:
          $ref: '#/components/schemas/ComputeType'
        UserStorage:
          $ref: '#/components/schemas/UserStorage'
        RootStorage:
          $ref: '#/components/schemas/RootStorage'
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: <p>The tags associated with the bundle.</p> <note> <p>To add tags at the same time when you're creating the bundle, you must create an IAM policy that grants your IAM user permissions to use <code>workspaces:CreateTags</code>. </p> </note>
    ResourceNotFoundException: {}
    AccessDeniedException: {}
    ResourceUnavailableException: {}
    BundleType:
      type: string
      enum:
      - REGULAR
      - STANDBY
    WorkspaceBundleDescription:
      type: string
      pattern: ^[a-zA-Z0-9_./() -]+$
      minLength: 1
      maxLength: 255
    Description:
      type: string
    CreateWorkspaceBundleResult:
      type: object
      properties:
        WorkspaceBundle:
          $ref: '#/components/schemas/WorkspaceBundle'
    Timestamp:
      type: string
      format: date-time
    TagKey:
      type: string
      minLength: 1
      maxLength: 127
    UserStorage:
      type: object
      properties:
        Capacity:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The size of the user volume.
      description: Describes the user volume for a WorkSpace bundle.
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
  securitySchemes:
