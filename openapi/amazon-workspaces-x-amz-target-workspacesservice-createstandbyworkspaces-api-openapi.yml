components:
  schemas:
    WorkspaceErrorCode:
      type: string
    PendingCreateStandbyWorkspacesRequest:
      type: object
      properties:
        UserName:
          allOf:
          - $ref: '#/components/schemas/UserName'
          - description: <p>Describes the standby WorkSpace that was created.</p> <p>Because this operation is asynchronous, the identifier returned is not immediately available for use with other operations. For example, if you call <a href="https://docs.aws.amazon.com/workspaces/latest/api/API_DescribeWorkspaces.html"> DescribeWorkspaces</a> before the WorkSpace is created, the information returned can be incomplete. </p>
        DirectoryId:
          allOf:
          - $ref: '#/components/schemas/DirectoryId'
          - description: The identifier of the directory for the standby WorkSpace.
        State:
          allOf:
          - $ref: '#/components/schemas/WorkspaceState'
          - description: The operational state of the standby WorkSpace.
        WorkspaceId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - description: The identifier of the standby WorkSpace.
      description: Information about the standby WorkSpace.
    CreateStandbyWorkspacesResult:
