    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeConnectionAliases
      description: Retrieves a list that describes the connection aliases used for cross-Region redirection. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/cross-region-redirection.html"> Cross-Region Redirection for Amazon WorkSpaces</a>.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeConnectionAliasesResult'
        '480':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '481':
          description: InvalidParameterValuesException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValuesException'
        '482':
          description: OperationNotSupportedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotSupportedException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeConnectionAliasesRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.DescribeConnectionAliases
      summary: Amazon WorkSpaces Describe Connection Aliases
      tags:
      - '#X Amz Target=WorkspacesService.DescribeConnectionAliases'
components:
  schemas:
    ConnectionAliasAssociation:
      type: object
      properties:
        AssociationStatus:
          allOf:
          - $ref: '#/components/schemas/AssociationStatus'
          - description: The association status of the connection alias.
        AssociatedAccountId:
          allOf:
          - $ref: '#/components/schemas/AwsAccount'
          - description: The identifier of the Amazon Web Services account that associated the connection alias with a directory.
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The identifier of the directory associated with a connection alias.
        ConnectionIdentifier:
          allOf:
          - $ref: '#/components/schemas/ConnectionIdentifier'
          - description: The identifier of the connection alias association. You use the connection identifier in the DNS TXT record when you're configuring your DNS routing policies.
      description: Describes a connection alias association that is used for cross-Region redirection. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/cross-region-redirection.html"> Cross-Region Redirection for Amazon WorkSpaces</a>.
    AccessDeniedException: {}
    ConnectionAliasState:
      type: string
      enum:
      - CREATING
      - CREATED
      - DELETING
    ConnectionIdentifier:
      type: string
      pattern: ^[a-zA-Z0-9]+$
      minLength: 1
      maxLength: 20
    PaginationToken:
      type: string
      minLength: 1
      maxLength: 2048
    InvalidParameterValuesException: {}
    AssociationStatus:
      type: string
      enum:
      - NOT_ASSOCIATED
      - ASSOCIATED_WITH_OWNER_ACCOUNT
      - ASSOCIATED_WITH_SHARED_ACCOUNT
      - PENDING_ASSOCIATION
      - PENDING_DISASSOCIATION
    ConnectionAliasList:
      type: array
      items:
        $ref: '#/components/schemas/ConnectionAlias'
      minItems: 1
      maxItems: 25
    ConnectionAliasIdList:
      type: array
      items:
        $ref: '#/components/schemas/ConnectionAliasId'
      minItems: 1
      maxItems: 25
    ConnectionAliasId:
      type: string
      pattern: ^wsca-[0-9a-z]{8,63}$
      minLength: 13
      maxLength: 68
    AwsAccount:
      type: string
      pattern: ^\d{12}$
    ConnectionString:
      type: string
      pattern: ^[.0-9a-zA-Z\-]{1,255}$
      minLength: 1
      maxLength: 255
    ConnectionAlias:
      type: object
      properties:
        ConnectionString:
          allOf:
          - $ref: '#/components/schemas/ConnectionString'
          - description: The connection string specified for the connection alias. The connection string must be in the form of a fully qualified domain name (FQDN), such as <code>www.example.com</code>.
        AliasId:
          allOf:
          - $ref: '#/components/schemas/ConnectionAliasId'
          - description: The identifier of the connection alias.
        State:
          allOf:
          - $ref: '#/components/schemas/ConnectionAliasState'
          - description: The current state of the connection alias.
        OwnerAccountId:
          allOf:
          - $ref: '#/components/schemas/AwsAccount'
          - description: The identifier of the Amazon Web Services account that owns the connection alias.
        Associations:
          allOf:
          - $ref: '#/components/schemas/ConnectionAliasAssociationList'
          - description: The association status of the connection alias.
      description: Describes a connection alias. Connection aliases are used for cross-Region redirection. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/cross-region-redirection.html"> Cross-Region Redirection for Amazon WorkSpaces</a>.
    NonEmptyString:
      type: string
      minLength: 1
    Limit:
      type: integer
      minimum: 1
      maximum: 25
    OperationNotSupportedException: {}
    DescribeConnectionAliasesRequest:
      type: object
      title: DescribeConnectionAliasesRequest
      properties:
        AliasIds:
          allOf:
          - $ref: '#/components/schemas/ConnectionAliasIdList'
          - description: The identifiers of the connection aliases to describe.
        ResourceId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The identifier of the directory associated with the connection alias.
        Limit:
          allOf:
          - $ref: '#/components/schemas/Limit'
          - description: The maximum number of connection aliases to return.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: 'If you received a <code>NextToken</code> from a previous call that was paginated, provide this token to receive the next set of results. '
    ConnectionAliasAssociationList:
      type: array
      items:
        $ref: '#/components/schemas/ConnectionAliasAssociation'
      minItems: 1
      maxItems: 25
    DescribeConnectionAliasesResult:
      type: object
      properties:
        ConnectionAliases:
          allOf:
          - $ref: '#/components/schemas/ConnectionAliasList'
          - description: Information about the specified connection aliases.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: 'The token to use to retrieve the next page of results. This value is null when there are no more results to return. '
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
