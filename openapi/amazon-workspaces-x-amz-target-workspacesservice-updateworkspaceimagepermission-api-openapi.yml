tags:
- name: '#X Amz Target=WorkspacesService.UpdateWorkspaceImagePermission'
paths:
  /#X-Amz-Target=WorkspacesService.UpdateWorkspaceImagePermission:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: UpdateWorkspaceImagePermission
      description: 'Shares or unshares an image with one account in the same Amazon Web Services Region by specifying whether that account has permission to copy the image. If the copy image permission is granted, the image is shared with that account. If the copy image permission is revoked, the image is unshared with the account.


        After an image has been shared, the recipient account can copy the image to other Regions as needed.


        In the China (Ningxia) Region, you can copy images only within the same Region.


        In Amazon Web Services GovCloud (US), to copy images to and from other Regions, contact Amazon Web Services Support.


        For more information about sharing images, see Share or Unshare a Custom WorkSpaces Image.


        To delete an image that has been shared, you must unshare the image before you delete it.


        Sharing Bring Your Own License (BYOL) images across Amazon Web Services accounts isn''t supported at this time in Amazon Web Services GovCloud (US). To share BYOL images across accounts in Amazon Web Services GovCloud (US), contact Amazon Web Services Support.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWorkspaceImagePermissionResult'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: ResourceUnavailableException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceUnavailableException'
        '482':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
        '483':
          description: InvalidParameterValuesException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValuesException'
        '484':
          description: OperationNotSupportedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationNotSupportedException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceImagePermissionRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.UpdateWorkspaceImagePermission
      summary: Amazon WorkSpaces Update Workspace Image Permission
      tags:
      - '#X Amz Target=WorkspacesService.UpdateWorkspaceImagePermission'
components:
