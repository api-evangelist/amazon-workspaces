      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.CreateWorkspaceImage
      summary: Amazon WorkSpaces Create Workspace Image
      tags:
      - '#X Amz Target=WorkspacesService.CreateWorkspaceImage'
components:
  schemas:
    CreateWorkspaceImageResult:
      type: object
      properties:
        ImageId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageId'
          - description: The identifier of the new WorkSpace image.
        Name:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageName'
          - description: The name of the image.
        Description:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageDescription'
          - description: The description of the image.
        OperatingSystem:
          allOf:
          - $ref: '#/components/schemas/OperatingSystem'
          - description: The operating system that the image is running.
        State:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageState'
          - description: The availability status of the image.
        RequiredTenancy:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageRequiredTenancy'
          - description: Specifies whether the image is running on dedicated hardware. When Bring Your Own License (BYOL) is enabled, this value is set to DEDICATED. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/byol-windows-images.htm"> Bring Your Own Windows Desktop Images.</a>.
        Created:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date when the image was created.
        OwnerAccountId:
          allOf:
          - $ref: '#/components/schemas/AwsAccount'
          - description: The identifier of the Amazon Web Services account that owns the image.
    ResourceLimitExceededException: {}
    OperatingSystem:
      type: object
      properties:
        Type:
          allOf:
          - $ref: '#/components/schemas/OperatingSystemType'
          - description: The operating system.
      description: The operating system that the image is running.
    WorkspaceImageName:
      type: string
      pattern: ^[a-zA-Z0-9_./()\\-]+$
      minLength: 1
      maxLength: 64
    ResourceAlreadyExistsException: {}
    AccessDeniedException: {}
    WorkspaceImageState:
      type: string
      enum:
      - AVAILABLE
      - PENDING
      - ERROR
    OperatingSystemType:
      type: string
      enum:
      - WINDOWS
      - LINUX
    InvalidParameterValuesException: {}
    WorkspaceImageDescription:
      type: string
      pattern: ^[a-zA-Z0-9_./() -]+$
      minLength: 1
      maxLength: 256
    AwsAccount:
      type: string
      pattern: ^\d{12}$
    TagValue:
      type: string
      maxLength: 255
    Tag:
      type: object
      required:
      - Key
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key of the tag.
        Value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value of the tag.
      description: Describes a tag.
    WorkspaceId:
      type: string
      pattern: ^ws-[0-9a-z]{8,63}$
    Timestamp:
      type: string
      format: date-time
    TagKey:
      type: string
      minLength: 1
      maxLength: 127
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    OperationNotSupportedException: {}
    ResourceNotFoundException: {}
    WorkspaceImageRequiredTenancy:
      type: string
      enum:
      - DEFAULT
      - DEDICATED
    InvalidResourceStateException: {}
    CreateWorkspaceImageRequest:
      type: object
      required:
      - Name
      - Description
      - WorkspaceId
      title: CreateWorkspaceImageRequest
      properties:
        Name:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageName'
          - description: The name of the new WorkSpace image.
        Description:
          allOf:
          - $ref: '#/components/schemas/WorkspaceImageDescription'
          - description: The description of the new WorkSpace image.
        WorkspaceId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - description: The identifier of the source WorkSpace
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags that you want to add to the new WorkSpace image. To add tags when you're creating the image, you must create an IAM policy that grants your IAM user permission to use <code>workspaces:CreateTags</code>.
    WorkspaceImageId:
      type: string
      pattern: wsi-[0-9a-z]{9,63}$
