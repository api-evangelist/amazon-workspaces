security:
- hmac: []
tags:
- name: '#X Amz Target=WorkspacesService.CreateWorkspaces'
paths:
  /#X-Amz-Target=WorkspacesService.CreateWorkspaces:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateWorkspaces
      description: <p>Creates one or more WorkSpaces.</p> <p>This operation is asynchronous and returns before the WorkSpaces are created.</p> <note> <p>The <code>MANUAL</code> running mode value is only supported by Amazon WorkSpaces Core. Contact your account team to be allow-listed to use this value. For more information, see <a href="http://aws.amazon.com/workspaces/core/">Amazon WorkSpaces Core</a>.</p> </note>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkspacesResult'
        '480':
          description: ResourceLimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLimitExceededException'
        '481':
          description: InvalidParameterValuesException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValuesException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspacesRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.CreateWorkspaces
      summary: Amazon WorkSpaces Create Workspaces
      tags:
      - '#X Amz Target=WorkspacesService.CreateWorkspaces'
components:
  schemas:
    WorkspaceProperties:
      type: object
      properties:
        RunningMode:
          allOf:
          - $ref: '#/components/schemas/RunningMode'
          - description: <p>The running mode. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/running-mode.html">Manage the WorkSpace Running Mode</a>.</p> <note> <p>The <code>MANUAL</code> value is only supported by Amazon WorkSpaces Core. Contact your account team to be allow-listed to use this value. For more information, see <a href="http://aws.amazon.com/workspaces/core/">Amazon WorkSpaces Core</a>.</p> </note>
        RunningModeAutoStopTimeoutInMinutes:
          allOf:
          - $ref: '#/components/schemas/RunningModeAutoStopTimeoutInMinutes'
          - description: The time after a user logs off when WorkSpaces are automatically stopped. Configured in 60-minute intervals.
        RootVolumeSizeGib:
          allOf:
          - $ref: '#/components/schemas/RootVolumeSizeGib'
          - description: The size of the root volume. For important information about how to modify the size of the root and user volumes, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/modify-workspaces.html">Modify a WorkSpace</a>.
        UserVolumeSizeGib:
          allOf:
          - $ref: '#/components/schemas/UserVolumeSizeGib'
          - description: The size of the user storage. For important information about how to modify the size of the root and user volumes, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/modify-workspaces.html">Modify a WorkSpace</a>.
        ComputeTypeName:
          allOf:
          - $ref: '#/components/schemas/Compute'
          - description: The compute type. For more information, see <a href="http://aws.amazon.com/workspaces/details/#Amazon_WorkSpaces_Bundles">Amazon WorkSpaces Bundles</a>.
        Protocols:
          allOf:
          - $ref: '#/components/schemas/ProtocolList'
          - description: <p>The protocol. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces-protocols.html"> Protocols for Amazon WorkSpaces</a>.</p> <note> <ul> <li> <p>Only available for WorkSpaces created with PCoIP bundles.</p> </li> <li> <p>The <code>Protocols</code> property is case sensitive. Ensure you use <code>PCOIP</code> or <code>WSP</code>.</p> </li> <li> <p>Unavailable for Windows 7 WorkSpaces and WorkSpaces using GPU-based bundles (Graphics, GraphicsPro, Graphics.g4dn, and GraphicsPro.g4dn).</p> </li> </ul> </note>
      description: Describes a WorkSpace.
    UserVolumeSizeGib:
      type: integer
    BundleId:
      type: string
      pattern: ^wsb-[0-9a-z]{8,63}$
    ResourceLimitExceededException: {}
    Protocol:
      type: string
      enum:
      - PCOIP
      - WSP
    ModificationState:
      type: object
      properties:
        Resource:
          allOf:
          - $ref: '#/components/schemas/ModificationResourceEnum'
          - description: The resource.
        State:
          allOf:
          - $ref: '#/components/schemas/ModificationStateEnum'
          - description: The modification state.
      description: Describes a WorkSpace modification.
    WorkspaceRequest:
      type: object
      required:
      - DirectoryId
      - UserName
      - BundleId
      properties:
        DirectoryId:
          allOf:
          - $ref: '#/components/schemas/DirectoryId'
          - description: The identifier of the Directory Service directory for the WorkSpace. You can use <a>DescribeWorkspaceDirectories</a> to list the available directories.
        UserName:
          allOf:
          - $ref: '#/components/schemas/UserName'
          - description: The user name of the user for the WorkSpace. This user name must exist in the Directory Service directory for the WorkSpace.
        BundleId:
          allOf:
          - $ref: '#/components/schemas/BundleId'
          - description: The identifier of the bundle for the WorkSpace. You can use <a>DescribeWorkspaceBundles</a> to list the available bundles.
        VolumeEncryptionKey:
          allOf:
          - $ref: '#/components/schemas/VolumeEncryptionKey'
          - description: The ARN of the symmetric KMS key used to encrypt data stored on your WorkSpace. Amazon WorkSpaces does not support asymmetric KMS keys.
        UserVolumeEncryptionEnabled:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Indicates whether the data stored on the user volume is encrypted.
        RootVolumeEncryptionEnabled:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Indicates whether the data stored on the root volume is encrypted.
        WorkspaceProperties:
          allOf:
          - $ref: '#/components/schemas/WorkspaceProperties'
          - description: The WorkSpace properties.
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: The tags for the WorkSpace.
      description: Describes the information used to create a WorkSpace.
    WorkspaceList:
      type: array
      items:
        $ref: '#/components/schemas/Workspace'
    TagValue:
      type: string
      maxLength: 255
    Workspace:
      type: object
      properties:
        WorkspaceId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - description: The identifier of the WorkSpace.
        DirectoryId:
          allOf:
          - $ref: '#/components/schemas/DirectoryId'
          - description: The identifier of the Directory Service directory for the WorkSpace.
        UserName:
          allOf:
          - $ref: '#/components/schemas/UserName'
          - description: The user for the WorkSpace.
        IpAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          - description: The IP address of the WorkSpace.
        State:
          allOf:
          - $ref: '#/components/schemas/WorkspaceState'
          - description: <p>The operational state of the WorkSpace.</p> <note> <p>After a WorkSpace is terminated, the <code>TERMINATED</code> state is returned only briefly before the WorkSpace directory metadata is cleaned up, so this state is rarely returned. To confirm that a WorkSpace is terminated, check for the WorkSpace ID by using <a href="https://docs.aws.amazon.com/workspaces/latest/api/API_DescribeWorkspaces.html"> DescribeWorkSpaces</a>. If the WorkSpace ID isn't returned, then the WorkSpace has been successfully terminated.</p> </note>
        BundleId:
          allOf:
          - $ref: '#/components/schemas/BundleId'
          - description: The identifier of the bundle used to create the WorkSpace.
        SubnetId:
          allOf:
          - $ref: '#/components/schemas/SubnetId'
          - description: The identifier of the subnet for the WorkSpace.
        ErrorMessage:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The text of the error message that is returned if the WorkSpace cannot be created.
        ErrorCode:
          allOf:
          - $ref: '#/components/schemas/WorkspaceErrorCode'
          - description: The error code that is returned if the WorkSpace cannot be created.
        ComputerName:
          allOf:
          - $ref: '#/components/schemas/ComputerName'
          - description: 'The name of the WorkSpace, as seen by the operating system. The format of this name varies. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/launch-workspaces-tutorials.html"> Launch a WorkSpace</a>. '
        VolumeEncryptionKey:
          allOf:
          - $ref: '#/components/schemas/VolumeEncryptionKey'
          - description: The ARN of the symmetric KMS key used to encrypt data stored on your WorkSpace. Amazon WorkSpaces does not support asymmetric KMS keys.
        UserVolumeEncryptionEnabled:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Indicates whether the data stored on the user volume is encrypted.
        RootVolumeEncryptionEnabled:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Indicates whether the data stored on the root volume is encrypted.
        WorkspaceProperties:
          allOf:
          - $ref: '#/components/schemas/WorkspaceProperties'
          - description: The properties of the WorkSpace.
        ModificationStates:
          allOf:
          - $ref: '#/components/schemas/ModificationStateList'
          - description: The modification states of the WorkSpace.
        RelatedWorkspaces:
          allOf:
          - $ref: '#/components/schemas/RelatedWorkspaces'
          - description: The standby WorkSpace or primary WorkSpace related to the specified WorkSpace.
      description: Describes a WorkSpace.
    Region:
      type: string
      pattern: ^[-0-9a-z]{1,31}$
      minLength: 1
      maxLength: 31
    StandbyWorkspaceRelationshipType:
      type: string
      enum:
      - PRIMARY
      - STANDBY
    Tag:
      type: object
      required:
      - Key
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/TagKey'
          - description: The key of the tag.
        Value:
          allOf:
          - $ref: '#/components/schemas/TagValue'
          - description: The value of the tag.
      description: Describes a tag.
    WorkspaceId:
      type: string
      pattern: ^ws-[0-9a-z]{8,63}$
    RelatedWorkspaceProperties:
      type: object
      properties:
        WorkspaceId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - description: The identifier of the related WorkSpace.
        Region:
          allOf:
          - $ref: '#/components/schemas/Region'
          - description: The Region of the related WorkSpace.
        State:
          allOf:
          - $ref: '#/components/schemas/WorkspaceState'
          - description: Indicates the state of the WorkSpace.
        Type:
          allOf:
          - $ref: '#/components/schemas/StandbyWorkspaceRelationshipType'
          - description: Indicates the type of WorkSpace.
      description: Describes the related WorkSpace. The related WorkSpace could be a standby WorkSpace or primary WorkSpace related to the specified WorkSpace.
    WorkspaceState:
      type: string
      enum:
      - PENDING
      - AVAILABLE
      - IMPAIRED
      - UNHEALTHY
      - REBOOTING
      - STARTING
      - REBUILDING
      - RESTORING
      - MAINTENANCE
      - ADMIN_MAINTENANCE
      - TERMINATING
      - TERMINATED
      - SUSPENDED
      - UPDATING
      - STOPPING
      - STOPPED
      - ERROR
    ProtocolList:
      type: array
      items:
        $ref: '#/components/schemas/Protocol'
    SubnetId:
      type: string
      pattern: ^(subnet-([0-9a-f]{8}|[0-9a-f]{17}))$
      minLength: 15
      maxLength: 24
    VolumeEncryptionKey:
      type: string
    DirectoryId:
      type: string
      pattern: ^d-[0-9a-f]{8,63}$
      minLength: 10
      maxLength: 65
    ModificationResourceEnum:
      type: string
      enum:
      - ROOT_VOLUME
      - USER_VOLUME
      - COMPUTE_TYPE
    InvalidParameterValuesException: {}
    CreateWorkspacesResult:
      type: object
      properties:
        FailedRequests:
          allOf:
          - $ref: '#/components/schemas/FailedCreateWorkspaceRequests'
          - description: Information about the WorkSpaces that could not be created.
        PendingRequests:
          allOf:
          - $ref: '#/components/schemas/WorkspaceList'
          - description: <p>Information about the WorkSpaces that were created.</p> <p>Because this operation is asynchronous, the identifier returned is not immediately available for use with other operations. For example, if you call <a>DescribeWorkspaces</a> before the WorkSpace is created, the information returned can be incomplete.</p>
    Compute:
      type: string
      enum:
      - VALUE
      - STANDARD
      - PERFORMANCE
      - POWER
      - GRAPHICS
      - POWERPRO
      - GRAPHICSPRO
      - GRAPHICS_G4DN
      - GRAPHICSPRO_G4DN
    WorkspaceErrorCode:
      type: string
    WorkspaceRequestList:
      type: array
      items:
        $ref: '#/components/schemas/WorkspaceRequest'
      minItems: 1
      maxItems: 25
    ModificationStateEnum:
      type: string
      enum:
      - UPDATE_INITIATED
      - UPDATE_IN_PROGRESS
    ErrorType:
      type: string
    FailedCreateWorkspaceRequest:
      type: object
      properties:
        WorkspaceRequest:
          allOf:
          - $ref: '#/components/schemas/WorkspaceRequest'
          - description: Information about the WorkSpace.
        ErrorCode:
          allOf:
          - $ref: '#/components/schemas/ErrorType'
          - description: The error code that is returned if the WorkSpace cannot be created.
        ErrorMessage:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The text of the error message that is returned if the WorkSpace cannot be created.
      description: Describes a WorkSpace that cannot be created.
    RootVolumeSizeGib:
      type: integer
    IpAddress:
      type: string
    CreateWorkspacesRequest:
      type: object
      required:
      - Workspaces
      title: CreateWorkspacesRequest
      properties:
        Workspaces:
          allOf:
          - $ref: '#/components/schemas/WorkspaceRequestList'
          - description: The WorkSpaces to create. You can specify up to 25 WorkSpaces.
    RelatedWorkspaces:
      type: array
      items:
        $ref: '#/components/schemas/RelatedWorkspaceProperties'
    RunningMode:
      type: string
      enum:
      - AUTO_STOP
      - ALWAYS_ON
      - MANUAL
    RunningModeAutoStopTimeoutInMinutes:
      type: integer
    Description:
      type: string
    ModificationStateList:
      type: array
      items:
        $ref: '#/components/schemas/ModificationState'
    FailedCreateWorkspaceRequests:
      type: array
      items:
        $ref: '#/components/schemas/FailedCreateWorkspaceRequest'
    ComputerName:
      type: string
    TagKey:
      type: string
      minLength: 1
      maxLength: 127
    BooleanObject:
      type: boolean
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    UserName:
      type: string
      minLength: 1
      maxLength: 63
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
