  schemas:
    Description:
      type: string
    BooleanObject:
      type: boolean
    WorkspaceImageErrorCode:
      type: string
    WorkspaceImageName:
      type: string
      pattern: ^[a-zA-Z0-9_./()\\-]+$
      minLength: 1
      maxLength: 64
    WorkspaceImageIdList:
      type: array
      items:
        $ref: '#/components/schemas/WorkspaceImageId'
      minItems: 1
      maxItems: 25
