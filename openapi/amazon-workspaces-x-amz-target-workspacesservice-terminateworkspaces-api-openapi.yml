- hmac: []
tags:
- name: '#X Amz Target=WorkspacesService.TerminateWorkspaces'
paths:
  /#X-Amz-Target=WorkspacesService.TerminateWorkspaces:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: TerminateWorkspaces
      description: 'Terminates the specified WorkSpaces.


        Terminating a WorkSpace is a permanent action and cannot be undone. The user''s data is destroyed. If you need to archive any user data, contact Amazon Web Services Support before terminating the WorkSpace.


        You can terminate a WorkSpace that is in any state except SUSPENDED.


        This operation is asynchronous and returns before the WorkSpaces have been completely terminated. After a WorkSpace is terminated, the TERMINATED state is returned only briefly before the WorkSpace directory metadata is cleaned up, so this state is rarely returned. To confirm that a WorkSpace is terminated, check for the WorkSpace ID by using DescribeWorkSpaces. If the WorkSpace ID isn''t returned, then the WorkSpace has been successfully terminated.


        Simple AD and AD Connector are made available to you free of charge to use with WorkSpaces. If there are no WorkSpaces being used with your Simple AD or AD Connector directory for 30 consecutive days, this directory will be automatically deregistered for use with Amazon WorkSpaces, and you will be charged for this directory as per the Directory Service pricing terms.


        To delete empty directories, see Delete the Directory for Your WorkSpaces. If you delete your Simple AD or AD Connector directory, you can always create a new one when you want to start using WorkSpaces again.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminateWorkspacesResult'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateWorkspacesRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.TerminateWorkspaces
      summary: Amazon WorkSpaces Terminate Workspaces
      tags:
      - '#X Amz Target=WorkspacesService.TerminateWorkspaces'
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    Description:
      type: string
    FailedTerminateWorkspaceRequests:
      type: array
      items:
        $ref: '#/components/schemas/FailedWorkspaceChangeRequest'
    ErrorType:
      type: string
    WorkspaceId:
      type: string
      pattern: ^ws-[0-9a-z]{8,63}$
    TerminateWorkspacesRequest:
      type: object
      required:
      - TerminateWorkspaceRequests
      title: TerminateWorkspacesRequest
      properties:
        TerminateWorkspaceRequests:
          allOf:
          - $ref: '#/components/schemas/TerminateWorkspaceRequests'
          - description: The WorkSpaces to terminate. You can specify up to 25 WorkSpaces.
    TerminateWorkspaceRequests:
      type: array
      items:
        $ref: '#/components/schemas/TerminateRequest'
      minItems: 1
      maxItems: 25
    TerminateWorkspacesResult:
      type: object
      properties:
        FailedRequests:
          allOf:
          - $ref: '#/components/schemas/FailedTerminateWorkspaceRequests'
          - description: Information about the WorkSpaces that could not be terminated.
    TerminateRequest:
      type: object
      required:
      - WorkspaceId
      properties:
        WorkspaceId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - description: The identifier of the WorkSpace.
      description: Describes the information used to terminate a WorkSpace.
    FailedWorkspaceChangeRequest:
      type: object
      properties:
        WorkspaceId:
          allOf:
          - $ref: '#/components/schemas/WorkspaceId'
          - description: The identifier of the WorkSpace.
        ErrorCode:
          allOf:
          - $ref: '#/components/schemas/ErrorType'
          - description: The error code that is returned if the WorkSpace cannot be rebooted.
        ErrorMessage:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: The text of the error message that is returned if the WorkSpace cannot be rebooted.
      description: Describes a WorkSpace that could not be rebooted. (<a>RebootWorkspaces</a>), rebuilt (<a>RebuildWorkspaces</a>), restored (<a>RestoreWorkspace</a>), terminated (<a>TerminateWorkspaces</a>), started (<a>StartWorkspaces</a>), or stopped (<a>StopWorkspaces</a>).
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
