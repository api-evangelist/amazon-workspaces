security:
- hmac: []
tags:
- name: '#X Amz Target=WorkspacesService.DescribeWorkspaceDirectories'
paths:
  /#X-Amz-Target=WorkspacesService.DescribeWorkspaceDirectories:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeWorkspaceDirectories
      description: Describes the available directories that are registered with Amazon WorkSpaces.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeWorkspaceDirectoriesResult'
        '480':
          description: InvalidParameterValuesException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidParameterValuesException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeWorkspaceDirectoriesRequest'
      parameters:
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - WorkspacesService.DescribeWorkspaceDirectories
      summary: Amazon WorkSpaces Describe Workspace Directories
      tags:
      - '#X Amz Target=WorkspacesService.DescribeWorkspaceDirectories'
components:
  schemas:
    DescribeWorkspaceDirectoriesRequest:
      type: object
      title: DescribeWorkspaceDirectoriesRequest
      properties:
        DirectoryIds:
          allOf:
          - $ref: '#/components/schemas/DirectoryIdList'
          - description: The identifiers of the directories. If the value is null, all directories are retrieved.
        Limit:
          allOf:
          - $ref: '#/components/schemas/Limit'
          - description: The maximum number of directories to return.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: If you received a <code>NextToken</code> from a previous call that was paginated, provide this token to receive the next set of results.
    Alias:
      type: string
    SubnetIds:
      type: array
      items:
        $ref: '#/components/schemas/SubnetId'
      maxItems: 2
    DefaultOu:
      type: string
    CertificateAuthorityArn:
      type: string
      pattern: arn:[\w+=/,.@-]+:[\w+=/,.@-]+:[\w+=/,.@-]*:[0-9]*:[\w+=,.@-]+(/[\w+=,.@-]+)*
      minLength: 5
      maxLength: 200
    DirectoryName:
      type: string
    DefaultWorkspaceCreationProperties:
      type: object
      properties:
        EnableWorkDocs:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Specifies whether the directory is enabled for Amazon WorkDocs.
        EnableInternetAccess:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Specifies whether to automatically assign an Elastic public IP address to WorkSpaces in this directory by default. If enabled, the Elastic public IP address allows outbound internet access from your WorkSpaces when you’re using an internet gateway in the Amazon VPC in which your WorkSpaces are located. If you're using a Network Address Translation (NAT) gateway for outbound internet access from your VPC, or if your WorkSpaces are in public subnets and you manually assign them Elastic IP addresses, you should disable this setting. This setting applies to new WorkSpaces that you launch or to existing WorkSpaces that you rebuild. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces-vpc.html"> Configure a VPC for Amazon WorkSpaces</a>.
        DefaultOu:
          allOf:
          - $ref: '#/components/schemas/DefaultOu'
          - description: The organizational unit (OU) in the directory for the WorkSpace machine accounts.
        CustomSecurityGroupId:
          allOf:
          - $ref: '#/components/schemas/SecurityGroupId'
          - description: The identifier of the default security group to apply to WorkSpaces when they are created. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/amazon-workspaces-security-groups.html"> Security Groups for Your WorkSpaces</a>.
        UserEnabledAsLocalAdministrator:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Specifies whether WorkSpace users are local administrators on their WorkSpaces.
        EnableMaintenanceMode:
          allOf:
          - $ref: '#/components/schemas/BooleanObject'
          - description: Specifies whether maintenance mode is enabled for WorkSpaces. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/workspace-maintenance.html">WorkSpace Maintenance</a>.
      description: Describes the default values that are used to create WorkSpaces. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/update-directory-details.html">Update Directory Details for Your WorkSpaces</a>.
    SamlUserAccessUrl:
      type: string
      pattern: ^(http|https)\://\S+$
      minLength: 8
      maxLength: 200
    DirectoryList:
      type: array
      items:
        $ref: '#/components/schemas/WorkspaceDirectory'
    UserName:
      type: string
      minLength: 1
      maxLength: 63
    SamlProperties:
      type: object
      properties:
        Status:
          allOf:
          - $ref: '#/components/schemas/SamlStatusEnum'
          - description: <p>Indicates the status of SAML 2.0 authentication. These statuses include the following.</p> <ul> <li> <p>If the setting is <code>DISABLED</code>, end users will be directed to login with their directory credentials.</p> </li> <li> <p>If the setting is <code>ENABLED</code>, end users will be directed to login via the user access URL. Users attempting to connect to WorkSpaces from a client application that does not support SAML 2.0 authentication will not be able to connect.</p> </li> <li> <p>If the setting is <code>ENABLED_WITH_DIRECTORY_LOGIN_FALLBACK</code>, end users will be directed to login via the user access URL on supported client applications, but will not prevent clients that do not support SAML 2.0 authentication from connecting as if SAML 2.0 authentication was disabled.</p> </li> </ul>
        UserAccessUrl:
          allOf:
          - $ref: '#/components/schemas/SamlUserAccessUrl'
          - description: The SAML 2.0 identity provider (IdP) user access URL is the URL a user would navigate to in their web browser in order to federate from the IdP and directly access the application, without any SAML 2.0 service provider (SP) bindings.
        RelayStateParameterName:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: <p>The relay state parameter name supported by the SAML 2.0 identity provider (IdP). When the end user is redirected to the user access URL from the WorkSpaces client application, this relay state parameter name is appended as a query parameter to the URL along with the relay state endpoint to return the user to the client application session.</p> <p>To use SAML 2.0 authentication with WorkSpaces, the IdP must support IdP-initiated deep linking for the relay state URL. Consult your IdP documentation for more information.</p>
      description: Describes the enablement status, user access URL, and relay state parameter name that are used for configuring federation with an SAML 2.0 identity provider.
    IpAddress:
      type: string
    SecurityGroupId:
      type: string
      pattern: ^(sg-([0-9a-f]{8}|[0-9a-f]{17}))$
      minLength: 11
      maxLength: 20
    RegistrationCode:
      type: string
      minLength: 1
      maxLength: 20
    InvalidParameterValuesException: {}
    PaginationToken:
      type: string
      minLength: 1
      maxLength: 2048
    ReconnectEnum:
      type: string
      enum:
      - ENABLED
      - DISABLED
    AccessPropertyValue:
      type: string
      enum:
      - ALLOW
      - DENY
    IpGroupId:
      type: string
      pattern: wsipg-[0-9a-z]{8,63}$
    DirectoryIdList:
      type: array
      items:
        $ref: '#/components/schemas/DirectoryId'
      minItems: 1
      maxItems: 25
    SubnetId:
      type: string
      pattern: ^(subnet-([0-9a-f]{8}|[0-9a-f]{17}))$
      minLength: 15
      maxLength: 24
    DescribeWorkspaceDirectoriesResult:
      type: object
      properties:
        Directories:
          allOf:
          - $ref: '#/components/schemas/DirectoryList'
          - description: Information about the directories.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/PaginationToken'
          - description: 'The token to use to retrieve the next page of results. This value is null when there are no more results to return. '
    BooleanObject:
      type: boolean
    CertificateBasedAuthStatusEnum:
      type: string
      enum:
      - DISABLED
      - ENABLED
    IpGroupIdList:
      type: array
      items:
        $ref: '#/components/schemas/IpGroupId'
    WorkspaceDirectoryType:
      type: string
      enum:
      - SIMPLE_AD
      - AD_CONNECTOR
    SamlStatusEnum:
      type: string
      enum:
      - DISABLED
      - ENABLED
      - ENABLED_WITH_DIRECTORY_LOGIN_FALLBACK
    DnsIpAddresses:
      type: array
      items:
        $ref: '#/components/schemas/IpAddress'
    NonEmptyString:
      type: string
      minLength: 1
    CertificateBasedAuthProperties:
      type: object
      properties:
        Status:
          allOf:
          - $ref: '#/components/schemas/CertificateBasedAuthStatusEnum'
          - description: The status of the certificate-based authentication properties.
        CertificateAuthorityArn:
          allOf:
          - $ref: '#/components/schemas/CertificateAuthorityArn'
          - description: The Amazon Resource Name (ARN) of the Amazon Web Services Certificate Manager Private CA resource.
      description: Describes the properties of the certificate-based authentication you want to use with your WorkSpaces.
    WorkspaceDirectory:
      type: object
      properties:
        DirectoryId:
          allOf:
          - $ref: '#/components/schemas/DirectoryId'
          - description: The directory identifier.
        Alias:
          allOf:
          - $ref: '#/components/schemas/Alias'
          - description: The directory alias.
        DirectoryName:
          allOf:
          - $ref: '#/components/schemas/DirectoryName'
          - description: The name of the directory.
        RegistrationCode:
          allOf:
          - $ref: '#/components/schemas/RegistrationCode'
          - description: The registration code for the directory. This is the code that users enter in their Amazon WorkSpaces client application to connect to the directory.
        SubnetIds:
          allOf:
          - $ref: '#/components/schemas/SubnetIds'
          - description: The identifiers of the subnets used with the directory.
        DnsIpAddresses:
          allOf:
          - $ref: '#/components/schemas/DnsIpAddresses'
          - description: The IP addresses of the DNS servers for the directory.
        CustomerUserName:
          allOf:
          - $ref: '#/components/schemas/UserName'
          - description: The user name for the service account.
        IamRoleId:
          allOf:
          - $ref: '#/components/schemas/ARN'
          - description: The identifier of the IAM role. This is the role that allows Amazon WorkSpaces to make calls to other services, such as Amazon EC2, on your behalf.
        DirectoryType:
          allOf:
          - $ref: '#/components/schemas/WorkspaceDirectoryType'
          - description: The directory type.
        WorkspaceSecurityGroupId:
          allOf:
          - $ref: '#/components/schemas/SecurityGroupId'
          - description: The identifier of the security group that is assigned to new WorkSpaces.
        State:
          allOf:
          - $ref: '#/components/schemas/WorkspaceDirectoryState'
          - description: The state of the directory's registration with Amazon WorkSpaces. After a directory is deregistered, the <code>DEREGISTERED</code> state is returned very briefly before the directory metadata is cleaned up, so this state is rarely returned. To confirm that a directory is deregistered, check for the directory ID by using <a href="https://docs.aws.amazon.com/workspaces/latest/api/API_DescribeWorkspaceDirectories.html"> DescribeWorkspaceDirectories</a>. If the directory ID isn't returned, then the directory has been successfully deregistered.
        WorkspaceCreationProperties:
          allOf:
          - $ref: '#/components/schemas/DefaultWorkspaceCreationProperties'
          - description: The default creation properties for all WorkSpaces in the directory.
        ipGroupIds:
          allOf:
          - $ref: '#/components/schemas/IpGroupIdList'
          - description: The identifiers of the IP access control groups associated with the directory.
        WorkspaceAccessProperties:
          allOf:
          - $ref: '#/components/schemas/WorkspaceAccessProperties'
          - description: The devices and operating systems that users can use to access WorkSpaces.
        Tenancy:
          allOf:
          - $ref: '#/components/schemas/Tenancy'
          - description: Specifies whether the directory is dedicated or shared. To use Bring Your Own License (BYOL), this value must be set to <code>DEDICATED</code>. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/byol-windows-images.html">Bring Your Own Windows Desktop Images</a>.
        SelfservicePermissions:
          allOf:
          - $ref: '#/components/schemas/SelfservicePermissions'
          - description: The default self-service permissions for WorkSpaces in the directory.
        SamlProperties:
          allOf:
          - $ref: '#/components/schemas/SamlProperties'
          - description: Describes the enablement status, user access URL, and relay state parameter name that are used for configuring federation with an SAML 2.0 identity provider.
        CertificateBasedAuthProperties:
          allOf:
          - $ref: '#/components/schemas/CertificateBasedAuthProperties'
          - description: The certificate-based authentication properties used to authenticate SAML 2.0 Identity Provider (IdP) user identities to Active Directory for WorkSpaces login.
      description: Describes a directory that is used with Amazon WorkSpaces.
    Limit:
      type: integer
      minimum: 1
      maximum: 25
    ARN:
      type: string
      pattern: ^arn:aws:[A-Za-z0-9][A-za-z0-9_/.-]{0,62}:[A-za-z0-9_/.-]{0,63}:[A-za-z0-9_/.-]{0,63}:[A-Za-z0-9][A-za-z0-9_/.-]{0,127}$
    SelfservicePermissions:
      type: object
      properties:
        RestartWorkspace:
          allOf:
          - $ref: '#/components/schemas/ReconnectEnum'
          - description: Specifies whether users can restart their WorkSpace.
        IncreaseVolumeSize:
          allOf:
          - $ref: '#/components/schemas/ReconnectEnum'
          - description: Specifies whether users can increase the volume size of the drives on their WorkSpace.
        ChangeComputeType:
          allOf:
          - $ref: '#/components/schemas/ReconnectEnum'
          - description: Specifies whether users can change the compute type (bundle) for their WorkSpace.
        SwitchRunningMode:
          allOf:
          - $ref: '#/components/schemas/ReconnectEnum'
          - description: Specifies whether users can switch the running mode of their WorkSpace.
        RebuildWorkspace:
          allOf:
          - $ref: '#/components/schemas/ReconnectEnum'
          - description: Specifies whether users can rebuild the operating system of a WorkSpace to its original state.
      description: Describes the self-service permissions for a directory. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/enable-user-self-service-workspace-management.html">Enable Self-Service WorkSpace Management Capabilities for Your Users</a>.
    WorkspaceAccessProperties:
      type: object
      properties:
        DeviceTypeWindows:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can use Windows clients to access their WorkSpaces.
        DeviceTypeOsx:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can use macOS clients to access their WorkSpaces.
        DeviceTypeWeb:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can access their WorkSpaces through a web browser.
        DeviceTypeIos:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can use iOS devices to access their WorkSpaces.
        DeviceTypeAndroid:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can use Android and Android-compatible Chrome OS devices to access their WorkSpaces.
        DeviceTypeChromeOs:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can use Chromebooks to access their WorkSpaces.
        DeviceTypeZeroClient:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can use zero client devices to access their WorkSpaces.
        DeviceTypeLinux:
          allOf:
          - $ref: '#/components/schemas/AccessPropertyValue'
          - description: Indicates whether users can use Linux clients to access their WorkSpaces.
      description: The device types and operating systems that can be used to access a WorkSpace. For more information, see <a href="https://docs.aws.amazon.com/workspaces/latest/adminguide/workspaces-network-requirements.html">Amazon WorkSpaces Client Network Requirements</a>.
    Tenancy:
      type: string
      enum:
      - DEDICATED
      - SHARED
    WorkspaceDirectoryState:
      type: string
      enum:
      - REGISTERING
      - REGISTERED
      - DEREGISTERING
      - DEREGISTERED
      - ERROR
    DirectoryId:
      type: string
      pattern: ^d-[0-9a-f]{8,63}$
      minLength: 10
      maxLength: 65
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
